# A case = one behavior you test, and the rules that must catch it.
id: T1547.001-runkey
title: Registry Run key persistence
technique: T1547.001
agent: office01                 # Wazuh agent name of the test machine

test:
  performed_by: human
  how: >-
    Invoke-AtomicTest T1547.001 -TestNumbers 1 (reg.exe), plus the PowerShell variant
    Set-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -Name Updater

expected_rules: [100200, 100201]

