[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purpleloop"
version = "0.2.1"
description = "Grade Wazuh detection rules with lab evidence, and turn the results into training data."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.scripts]
purpleloop = "purpleloop.cli:main"

[tool.setuptools.packages.find]
include = ["purpleloop*"]
